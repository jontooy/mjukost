; /etc/php/8.4/fpm/pool.d/mjukost.conf on the Pi. Runs as pi, who owns /srv/mjukost and the database role.
[mjukost]
user = pi
group = pi
listen = /run/php/mjukost.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 30s
php_admin_value[upload_max_filesize] = 6M
php_admin_value[post_max_size] = 8M
