# /etc/nginx/sites-available/mjukost-api on the Pi. Loopback only: Tailscale Funnel is the public entry.
server {
    listen 127.0.0.1:8080;
    server_name _;
    root /srv/mjukost/api/public;
    index index.php;
    charset utf-8;
    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Public post images; the 3D world draws them onto canvases, which needs CORS.
    location /storage/post-images/ {
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/mjukost.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
